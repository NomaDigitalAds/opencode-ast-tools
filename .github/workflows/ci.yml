name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      AST_GREP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:test
      - run: npm test
      - run: npm run build
      - run: npm run test:opencode
        env:
          OPENCODE_SMOKE: "1"
      - run: npx --no-install ast-grep --version
      - run: npm run check:package

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
